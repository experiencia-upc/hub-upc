<!DOCTYPE html>
<html>
<head>

  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){

  <div class="logo">
    <img src="UPC_logo.png" height="70">

  <div class="subtitle">Hub de Experiencia · San Miguel</div>
  <div class="grid">
    <a href="https://estudiante.upc.edu.pe/public" class="btn" onclick="clarity('set', 'boton_clic', 'MiUPC')">

  </div>
</body>
</html>
